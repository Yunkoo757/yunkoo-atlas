name: Desktop Visual Evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'src/**'
      - 'vite.config.ts'
      - 'scripts/bundle-build-identity.mjs'
      - 'scripts/desktop-visual-scenarios.mjs'
      - 'scripts/packaged-desktop-visual-contract.mjs'
      - 'scripts/qa-desktop-visual.mjs'
      - 'scripts/qa-packaged-desktop-visual.mjs'
      - 'scripts/fixtures/desktop-visual-*'
      - 'scripts/fixtures/packaged-desktop-visual.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-visual-evidence.yml'

permissions:
  contents: read

concurrency:
  group: desktop-visual-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-packaged-visual:
    name: Windows packaged visual (100/125/150%)
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm exec install-electron

      - name: Run source quality gates
        run: |
          pnpm check:desktop-visual
          pnpm typecheck
          node --test scripts/fixtures/packaged-desktop-visual.test.mjs

      - name: Build production application
        run: pnpm build:app

      - name: Package native Windows artifact
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Install exact Windows artifact for packaged visual evidence
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $artifact = (Resolve-Path "release/Trader-Atlas-$version-win-x64.exe").Path
          $installRoot = Join-Path $env:RUNNER_TEMP 'trader-atlas-packaged-visual-installed'
          & $artifact /S "/D=$installRoot"
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed: $LASTEXITCODE" }
          "ATLAS_PACKAGED_ARTIFACT=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ATLAS_PACKAGED_EXECUTABLE=$(Join-Path $installRoot 'Trader Atlas.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ATLAS_PACKAGED_INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows packaged evidence at 100%
        env:
          ATLAS_PACKAGED_SCALE_FACTOR: '1'
        run: pnpm qa:desktop-visual:packaged

      - name: Run Windows packaged evidence at 125%
        env:
          ATLAS_PACKAGED_SCALE_FACTOR: '1.25'
        run: pnpm qa:desktop-visual:packaged

      - name: Run Windows packaged evidence at 150%
        env:
          ATLAS_PACKAGED_SCALE_FACTOR: '1.5'
        run: pnpm qa:desktop-visual:packaged

      - name: Uninstall exact Windows visual payload
        if: always()
        shell: pwsh
        run: |
          $uninstaller = Get-ChildItem -LiteralPath $env:ATLAS_PACKAGED_INSTALL_ROOT -Filter 'Uninstall*.exe' | Select-Object -First 1
          if ($null -eq $uninstaller) { throw 'Packaged visual uninstaller is missing' }
          & $uninstaller.FullName /S
          if ($LASTEXITCODE -ne 0) { throw "NSIS uninstall failed: $LASTEXITCODE" }
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          do {
            try { Remove-Item -LiteralPath $env:ATLAS_PACKAGED_INSTALL_ROOT -Recurse -Force -ErrorAction Stop; break }
            catch { if ([DateTime]::UtcNow -ge $deadline) { throw }; Start-Sleep -Milliseconds 100 }
          } while ($true)

      - name: Upload Windows packaged visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-Windows-x64-scales-attempt-${{ github.run_attempt }}
          path: test-results/desktop-visual-packaged/win32-x64-scale-*/
          if-no-files-found: warn
          retention-days: 30

  macos-packaged-visual:
    name: macOS ${{ matrix.arch }} packaged visual
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm exec install-electron

      - name: Run source quality gates
        run: |
          pnpm check:desktop-visual
          pnpm typecheck
          node --test scripts/fixtures/packaged-desktop-visual.test.mjs

      - name: Build production application
        run: pnpm build:app

      - name: Package native macOS artifact
        run: pnpm exec electron-builder --mac zip --${{ matrix.arch }} --publish never

      - name: Extract exact macOS artifact for packaged visual evidence
        run: |
          version=$(node -p "require('./package.json').version")
          artifact="$PWD/release/Trader-Atlas-$version-mac-${{ matrix.arch }}.zip"
          payload="$RUNNER_TEMP/trader-atlas-packaged-visual-${{ matrix.arch }}"
          mkdir -p "$payload"
          ditto -x -k "$artifact" "$payload"
          echo "ATLAS_PACKAGED_ARTIFACT=$artifact" >> "$GITHUB_ENV"
          echo "ATLAS_PACKAGED_EXECUTABLE=$payload/Trader Atlas.app/Contents/MacOS/Trader Atlas" >> "$GITHUB_ENV"
          echo "ATLAS_PACKAGED_PAYLOAD_ROOT=$payload" >> "$GITHUB_ENV"

      - name: Run packaged visual and lifecycle evidence
        env:
          ATLAS_PACKAGED_SCALE_FACTOR: '2'
        run: pnpm qa:desktop-visual:packaged

      - name: Remove extracted macOS visual payload
        if: always()
        run: rm -rf "$ATLAS_PACKAGED_PAYLOAD_ROOT"

      - name: Upload macOS packaged visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-macOS-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: test-results/desktop-visual-packaged/darwin-${{ matrix.arch }}-scale-200/
          if-no-files-found: error
          retention-days: 30
