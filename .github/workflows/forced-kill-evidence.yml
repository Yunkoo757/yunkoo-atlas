name: Electron Platform Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/main.ts'
      - 'electron/forcedKillQa.ts'
      - 'vite.config.ts'
      - 'electron/library/storage.ts'
      - 'electron/library/ipc.ts'
      - 'electron/library/sessionGate.ts'
      - 'electron/library/libraryActivation.ts'
      - 'electron/library/libraryActivation.test.ts'
      - 'electron/library/storageRecovery.ts'
      - 'electron/library/storageRecovery.test.ts'
      - 'electron/preload.ts'
      - 'electron/buildIdentity.ts'
      - 'src/App.tsx'
      - 'src/main.tsx'
      - 'src/AppStorageRecovery.browser.test.html'
      - 'src/AppStorageRecovery.browser.test.tsx'
      - 'src/lib/storageRecovery.ts'
      - 'src/types/journalBridge.ts'
      - 'src/views/settings/DataSettingsPanel.tsx'
      - 'electron/library/atomicFile.ts'
      - 'electron/library/atomicFile.test.ts'
      - 'electron/library/assetGc.test.ts'
      - 'electron/library/assetInventory.test.ts'
      - 'electron/platformSafety.test.ts'
      - 'scripts/bundle-build-identity.mjs'
      - 'scripts/git-provenance.mjs'
      - 'scripts/run-forced-kill-evidence.mjs'
      - 'scripts/run-asset-lifecycle-platform.mjs'
      - 'scripts/run-electron-safety-platform.mjs'
      - 'scripts/qa-storage-recovery-lifecycle.mjs'
      - 'scripts/fixtures/storage-recovery-lifecycle.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/file-system-type.mjs'
      - 'scripts/fixtures/forced-kill-evidence.test.mjs'
      - '.github/workflows/forced-kill-evidence.yml'
      - '.github/workflows/desktop-visual-evidence.yml'
      - 'scripts/desktop-visual-scenarios.mjs'
      - 'scripts/packaged-desktop-visual-contract.mjs'
      - 'scripts/qa-packaged-desktop-visual.mjs'
      - 'scripts/fixtures/packaged-desktop-visual.test.mjs'

permissions:
  contents: read

jobs:
  macos-packaged-visual:
    if: github.event_name == 'workflow_dispatch'
    name: macOS ${{ matrix.arch }} packaged visual
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm exec install-electron

      - name: Run source quality gates
        run: |
          pnpm check:desktop-visual
          pnpm typecheck
          node --test scripts/fixtures/packaged-desktop-visual.test.mjs

      - name: Build production application
        run: pnpm build:app

      - name: Package native macOS artifact
        run: pnpm exec electron-builder --mac zip --${{ matrix.arch }} --publish never

      - name: Extract exact macOS artifact for packaged visual evidence
        run: |
          version=$(node -p "require('./package.json').version")
          artifact="$PWD/release/Trader-Atlas-$version-mac-${{ matrix.arch }}.zip"
          payload="$RUNNER_TEMP/trader-atlas-packaged-visual-${{ matrix.arch }}"
          mkdir -p "$payload"
          ditto -x -k "$artifact" "$payload"
          echo "ATLAS_PACKAGED_ARTIFACT=$artifact" >> "$GITHUB_ENV"
          echo "ATLAS_PACKAGED_EXECUTABLE=$payload/Trader Atlas.app/Contents/MacOS/Trader Atlas" >> "$GITHUB_ENV"
          echo "ATLAS_PACKAGED_PAYLOAD_ROOT=$payload" >> "$GITHUB_ENV"

      - name: Run packaged visual and lifecycle evidence
        env:
          ATLAS_PACKAGED_SCALE_FACTOR: '2'
        run: pnpm qa:desktop-visual:packaged

      - name: Remove extracted macOS visual payload
        if: always()
        run: rm -rf "$ATLAS_PACKAGED_PAYLOAD_ROOT"

      - name: Upload macOS packaged visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-macOS-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: test-results/desktop-visual-packaged/darwin-${{ matrix.arch }}-scale-200/
          if-no-files-found: error
          retention-days: 30

  platform-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm exec install-electron

      - name: Build production Electron application
        run: pnpm build:app

      - name: Run schema migration, stage rollover, and library switching evidence
        run: pnpm test:live-stage:desktop

      - name: Run forced-kill process evidence
        run: pnpm test:forced-kill:electron

      - name: Run storage recovery lifecycle evidence
        run: pnpm test:storage-recovery:electron

      - name: Run asset lifecycle evidence
        run: pnpm test:asset-lifecycle:electron

      - name: Run Electron safety evidence
        run: pnpm test:electron-safety:platform

      - name: Upload raw process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forced-kill-${{ runner.os }}
          path: test-results/forced-kill/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload raw Electron safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-safety-${{ runner.os }}
          path: test-results/platform-evidence/electron-safety-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload raw asset lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-lifecycle-${{ runner.os }}
          path: test-results/platform-evidence/asset-lifecycle-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload raw storage recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-recovery-${{ runner.os }}
          path: test-results/storage-recovery/storage-recovery-electron.json
          if-no-files-found: error
          retention-days: 30
