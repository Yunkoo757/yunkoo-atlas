name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main commit to certify before tagging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QA_PERFORMANCE_PROFILE: hosted-windows
      TZ: Asia/Shanghai

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Verify checkout identity
        shell: pwsh
        run: |
          if ("${{ inputs.commit }}" -ne "${{ github.sha }}") {
            throw "Candidate input must equal the dispatched main commit"
          }
          if ((git rev-parse HEAD) -ne "${{ inputs.commit }}") {
            throw "Candidate checkout does not match requested commit"
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm exec install-electron

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Run deterministic release quality gate
        run: pnpm qa:full

      - name: Run persistence correctness smoke gate
        run: pnpm benchmark:persistence

      - name: Run executable release drills
        run: pnpm verify:release-train-drills

      - name: Run approved JSON compatibility corpus
        run: pnpm measure:json-compatibility

      - name: Verify storage recovery evidence exists
        if: always()
        shell: pwsh
        run: |
          $recoveryEvidence = 'test-results/storage-recovery/storage-recovery-electron.json'
          if (-not (Test-Path -LiteralPath 'test-results/storage-recovery/storage-recovery-electron.json' -PathType Leaf)) {
            throw "Missing storage recovery evidence: $recoveryEvidence"
          }

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.commit }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/qa-release-full.json
            test-results/quality-execution.json
            test-results/quality-contract.json
            test-results/storage-recovery/storage-recovery-electron.json
            test-results/persistence-benchmark/persistence-smoke.json
            test-results/release-trains/release-train-drills.json
            test-results/json-compatibility/json-compatibility.json
          if-no-files-found: error
          retention-days: 30
