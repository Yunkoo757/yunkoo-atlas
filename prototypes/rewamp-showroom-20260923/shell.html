<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas × Rewamp · 可操作组件展厅</title><style>
/* ATLAS_CSS */
*{box-sizing:border-box}body{margin:0;font:var(--type-row-weight) var(--type-row-size)/var(--type-row-line-height) var(--font-ui);background:var(--surface-app);color:var(--text-primary);-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}h1,h2,p{margin:0}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}a{color:var(--accent-readable);text-decoration:none}a:hover{text-decoration:underline}.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-6);border-bottom:1px solid var(--border-divider)}.brand{display:flex;gap:var(--sp-3);align-items:center}.brand b{color:var(--accent-readable)}.meta{font-size:var(--type-metadata-size);line-height:var(--type-metadata-line-height);color:var(--text-content-metadata)}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);height:calc(100vh - 52px)}aside{padding:var(--sp-4) var(--sp-3);border-right:1px solid var(--border-divider);display:flex;flex-direction:column;min-height:0;gap:var(--sp-3)}.search{height:var(--control-height-md);padding:0 var(--sp-3);color:var(--text-primary);border:1px solid var(--field-border);border-radius:var(--radius-6);background:var(--field-bg);width:100%}.filters{display:flex;gap:var(--sp-1);flex-wrap:wrap}.filters button{font-size:var(--type-metadata-size)}.ui-btn[aria-pressed=true]{background:var(--surface-control-active);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--surface-control-border-active)}#catalog{overflow-y:auto;min-height:0;flex:1;padding-right:var(--sp-1)}.group{margin:var(--sp-4) 0 var(--sp-2);padding:0 var(--sp-2);font-size:var(--type-metadata-size);font-weight:var(--font-weight-medium);color:var(--text-content-metadata)}.item{width:100%;display:block;text-align:left;padding:var(--sp-2);border:1px solid transparent;border-radius:var(--radius-6);background:transparent;color:var(--text-secondary);margin-bottom:var(--sp-1)}.item:hover{background:var(--bg-hover)}.item[aria-current=true]{color:var(--text-primary);background:var(--bg-selected);border-color:var(--border-default)}.item strong{font-weight:var(--font-weight-medium);display:flex;justify-content:space-between;gap:var(--sp-2)}.item small{display:block;color:var(--text-content-metadata);font-size:var(--type-caption-size);line-height:var(--type-caption-line-height);margin-top:var(--sp-1);overflow-wrap:anywhere}.selected-marker{color:var(--accent-readable)}.aside-foot{padding-top:var(--sp-3);border-top:1px solid var(--border-divider)}main{min-width:0;overflow:auto;padding:var(--sp-6) var(--page-inset-default)}.head{display:flex;justify-content:space-between;gap:var(--sp-4);align-items:start;max-width:var(--page-rail-wide);margin:auto}h1{font-size:var(--type-page-title-size);line-height:var(--type-page-title-line-height);font-weight:var(--type-page-title-weight)}#english{margin-top:var(--sp-1)}.head-actions{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}.modes{display:flex;gap:var(--sp-1)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin:var(--sp-5) auto var(--sp-3);max-width:var(--page-rail-wide);flex-wrap:wrap}.toolbar-right{display:flex;gap:var(--sp-1);align-items:center}.stage-shell{max-width:var(--page-rail-wide);margin:auto;background:var(--surface-pane);border:1px solid var(--border-default);border-radius:var(--radius-10);overflow:hidden}.stage-title{padding:var(--sp-3) var(--sp-4);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-divider);gap:var(--sp-3)}#frames{display:grid;grid-template-columns:1fr;min-width:0;background:var(--surface-inset)}#frames.compare{grid-template-columns:1fr 1fr}.frame-wrap{min-width:0;position:relative}.frame-wrap+.frame-wrap{border-left:1px solid var(--border-default)}.frame-label{height:32px;display:flex;align-items:center;padding:0 var(--sp-3);background:var(--surface-inset);color:var(--text-content-metadata);font-size:var(--type-metadata-size)}iframe{width:100%;height:min(62vh,640px);min-height:480px;border:0;display:block;background:var(--surface-pane)}.hint{display:flex;gap:var(--sp-3);align-items:baseline;padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border-divider);color:var(--text-secondary)}.hint strong{color:var(--text-primary);font-weight:var(--font-weight-medium);white-space:nowrap}.details{max-width:var(--page-rail-wide);margin:var(--sp-5) auto 0;display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-6)}.details h2{font-size:var(--type-section-title-size);line-height:var(--type-section-title-line-height);font-weight:var(--type-section-title-weight);margin-bottom:var(--sp-2)}.details p{color:var(--text-secondary)}.footer{max-width:var(--page-rail-wide);margin:var(--sp-5) auto 0;padding-top:var(--sp-3);border-top:1px solid var(--border-divider);display:flex;justify-content:space-between;gap:var(--sp-3)}.fullscreen .top,.fullscreen aside,.fullscreen .head,.fullscreen .details,.fullscreen .footer{display:none}.fullscreen .shell{display:block;height:100vh}.fullscreen main{height:100vh;padding:var(--sp-3)}.fullscreen iframe{height:calc(100vh - 156px)}[hidden]{display:none!important}::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:var(--radius-full)}@media(max-width:1100px){.shell{grid-template-columns:220px minmax(0,1fr)}main{padding:var(--sp-5)}#frames.compare{grid-template-columns:1fr}#frames.compare .frame-wrap+.frame-wrap{border-left:0;border-top:1px solid var(--border-default)}.head{flex-wrap:wrap}.details{gap:var(--sp-4)}}
</style></head><body>
<header class="top"><div class="brand"><b>A</b><strong>Trader Atlas</strong><span class="meta">× Rewamp UI · 交互展厅</span></div><span class="meta" id="coverage"></span></header>
<div class="shell"><aside><input class="search" id="search" placeholder="搜索名称、场景或分类…" aria-label="筛选组件"><div class="filters"><button class="ui-btn ui-btn-ghost" data-filter="featured" aria-pressed="true">先看这组</button><button class="ui-btn ui-btn-ghost" data-filter="all" aria-pressed="false">全部</button><button class="ui-btn ui-btn-ghost" data-filter="saved" aria-pressed="false">我的选择</button></div><nav id="catalog" aria-label="组件目录"></nav><div class="aside-foot"><p class="meta" id="saveCount" role="status"></p><button class="ui-btn ui-btn-ghost" id="exportSelection">导出选择清单 ↓</button></div></aside>
<main><div class="head"><div><h1 id="title"></h1><p class="meta" id="english"></p></div><div class="head-actions"><button class="ui-btn ui-btn-bordered" id="save" aria-pressed="false">☆ 留待迁移</button><a id="source" class="ui-btn ui-btn-ghost" target="_blank" rel="noreferrer">官网原版 ↗</a></div></div>
<div class="toolbar"><div class="modes" aria-label="演示模式"><button class="ui-btn ui-btn-bordered" data-mode="atlas">Atlas 场景</button><button class="ui-btn ui-btn-bordered" data-mode="original">原版效果</button><button class="ui-btn ui-btn-bordered" data-mode="compare">并排对照</button></div><div class="toolbar-right"><button class="ui-btn ui-btn-ghost" id="theme">切换浅色</button><button class="ui-btn ui-btn-ghost" id="replay">重新播放</button><button class="ui-btn ui-btn-ghost" id="expand">放大演示</button></div></div>
<div class="stage-shell"><div class="stage-title"><span id="scene"></span><span class="meta" id="stageNote"></span></div><div id="frames"></div><div class="hint"><strong>试一试</strong><span id="hint"></span></div></div>
<div class="details"><div><h2>这里保留了什么</h2><p id="changes"></p></div><div><h2>放进 Atlas 后，值得观察什么</h2><p id="question"></p></div></div><div class="footer"><span class="meta">真实运行上游组件。示例数据与动画不执行交易、备份或保存。</span><span class="meta" id="status" role="status">正在加载</span></div></main></div>
<script>
const catalog=__CATALOG_DATA__;
const renderer=__RENDERER_DATA__;
const $=id=>document.getElementById(id);let current=catalog[0],filter='featured',mode='atlas',theme='dark',saved=[];
try{saved=JSON.parse(localStorage.getItem('atlas-rewamp-showroom-selections-v1')||'[]')}catch{}
const questions={cards:'卡片的层叠、翻转和运动是否让案例更有吸引力？查看图表细节时，遮挡和透视能否接受？',navbars:'连续高亮和弹簧反馈是否比现有导航更有辨识度？它的体积、字重和移动幅度是否合适？',sidebars:'你是否喜欢这种焦点引导和图标反馈？频繁切换页面时，位置与文字是否足够稳定？',buttons:'这种材质和按下反馈是否适合 Atlas？持续动效应留给主要动作，还是普通按钮也能使用？','search-bars':'展开和形变是否清楚提示可以输入？你能否接受宽度变化，以及相邻内容的空间占用？',toggles:'这种拟物切换是否值得保留？如果喜欢，可以先讨论用于哪一种真实设置。',bgs:'这种背景适合启动页、空状态或独立展示页吗？放在交易工作台是否会分散注意？',text:'可以用于低频的欢迎或完成状态吗？高频数据与盈亏数字是否应继续保持稳定？','ai-ui':'作为低频等待或助手状态是否有价值？目前先看视觉效果，不预设 Atlas 要新增 AI 功能。',cursors:'跟随反馈是否舒服？它是否遮挡图表、影响定位，或让你希望立即关闭？'};
function renderList(){const q=$('search').value.trim().toLowerCase();const shown=catalog.filter(e=>(filter==='all'||filter==='featured'&&e.featured||filter==='saved'&&saved.includes(e.slug))&&[e.title,e.zh,e.scene,e.groupLabel].join(' ').toLowerCase().includes(q));$('catalog').replaceChildren();let last='';for(const e of shown){if(e.groupLabel!==last){const h=document.createElement('p');h.className='group';h.textContent=e.groupLabel;$('catalog').append(h);last=e.groupLabel}const b=document.createElement('button');b.className='item';b.dataset.slug=e.slug;b.setAttribute('aria-current',String(e.slug===current.slug));const strong=document.createElement('strong');strong.append(document.createTextNode(e.zh));if(saved.includes(e.slug)){const s=document.createElement('span');s.className='selected-marker';s.textContent='★';strong.append(s)}const sub=document.createElement('small');sub.textContent=e.title;b.append(strong,sub);b.onclick=()=>select(e);$('catalog').append(b)}if(!shown.length){const p=document.createElement('p');p.className='meta';p.textContent=filter==='saved'?'还没有选择。喜欢的组件可点击“留待迁移”。':'没有匹配组件';$('catalog').append(p)}$('saveCount').textContent='已选择 '+saved.length+' 个组件';}
function renderFrame(){const comparisons=mode==='compare';$('frames').classList.toggle('compare',comparisons);$('frames').replaceChildren();$('status').textContent='正在加载原组件…';for(const view of comparisons?['original','atlas']:[mode]){const wrap=document.createElement('div');wrap.className='frame-wrap';if(comparisons){const label=document.createElement('div');label.className='frame-label';label.textContent=view==='original'?'Rewamp 原版':'Atlas 示例内容 · 原动效';wrap.append(label)}const frame=document.createElement('iframe');frame.title=current.zh+' · '+(view==='atlas'?'Atlas 场景':'原版效果');frame.dataset.previewMode=view;frame.setAttribute('sandbox','allow-scripts');frame.srcdoc=renderer.replace('__CONFIG_PLACEHOLDER__',JSON.stringify({slug:current.slug,mode:view,theme,scene:current.scene}).replaceAll('<','\\u003c'));wrap.append(frame);$('frames').append(wrap)}document.querySelectorAll('[data-mode]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.mode===mode));b.disabled=!current.context&&b.dataset.mode!=='original'});$('theme').textContent=theme==='dark'?'切换浅色':'切换暗色';$('stageNote').textContent=mode==='original'?'原版样式与交互':mode==='compare'?'两侧均可操作':'仅替换示例内容，保留组件表现';}
function select(e){current=e;if(!e.context)mode='original';else if(mode==='original'&&document.querySelector('[data-mode=atlas]').disabled)mode='atlas';$('title').textContent=e.zh;$('english').textContent=e.title+' · '+e.groupLabel;$('scene').textContent=e.scene;$('hint').textContent=e.hint;$('changes').textContent=e.changes;$('question').textContent=questions[e.group];$('source').href='https://www.rewampui.com/components/'+e.slug;updateSave();renderList();renderFrame();}
function updateSave(){const on=saved.includes(current.slug);$('save').textContent=on?'★ 已留待迁移':'☆ 留待迁移';$('save').setAttribute('aria-pressed',String(on));}
$('save').onclick=()=>{saved=saved.includes(current.slug)?saved.filter(s=>s!==current.slug):[...saved,current.slug];try{localStorage.setItem('atlas-rewamp-showroom-selections-v1',JSON.stringify(saved))}catch{}updateSave();renderList();};
$('search').oninput=renderList;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderList()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderFrame()});$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';renderFrame()};$('replay').onclick=renderFrame;$('expand').onclick=()=>{document.body.classList.toggle('fullscreen');$('expand').textContent=document.body.classList.contains('fullscreen')?'退出放大':'放大演示'};
$('exportSelection').onclick=()=>{const chosen=catalog.filter(e=>saved.includes(e.slug)).map(e=>({component:e.title,slug:e.slug,scene:e.scene,url:'https://www.rewampui.com/components/'+e.slug}));const blob=new Blob([JSON.stringify({date:new Date().toISOString(),purpose:'Atlas 组件候选，尚未确认正式迁移',selected:chosen},null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='atlas-rewamp-selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
window.addEventListener('message',e=>{if(![...document.querySelectorAll('iframe')].some(f=>f.contentWindow===e.source))return;if(e.data?.kind==='rewamp-ready')$('status').textContent='可操作预览 · 可点击“重新播放”重置';if(e.data?.kind==='rewamp-error')$('status').textContent='原版组件运行失败：'+e.data.error;});
$('coverage').textContent=catalog.length+' 个原版组件 / '+catalog.filter(e=>e.context).length+' 个 Atlas 场景';select(current);
window.__SHOWROOM__={catalog,select:slug=>select(catalog.find(e=>e.slug===slug))};
</script></body></html>
