<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trader Atlas · 交易列表小尺寸品种图标对比</title>
  <style>
    :root {
      color-scheme: dark;
      --surface-app: #08090b;
      --surface-pane: #0d0e10;
      --surface-control: #151619;
      --surface-hover: #191a1e;
      --border-subtle: rgba(255,255,255,.055);
      --border-default: rgba(255,255,255,.09);
      --text-strong: #f2f2f4;
      --text-body: #c7c8cd;
      --text-muted: #85878f;
      --text-faint: #55575e;
      --accent: #7b83ed;
      --pos: #63c98f;
      --neg: #ef706f;
      --warn: #e7bd43;
      --row-h: 52px;
      --mark-size: 18px;
      --sidebar: 224px;
      --gold: #e5bb3d;
      --eur: #4c9ade;
      --gbp: #d16b93;
      --btc: #f2a529;
      --eth: #858af7;
      --sol: #4ec5a5;
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1024px; background: var(--surface-app); color: var(--text-body); }
    button { font: inherit; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) minmax(760px, 1fr); gap: 8px; padding: 8px; }
    .sidebar { padding: 12px; border-right: 1px solid var(--border-subtle); }
    .brand { height: 40px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 650; color: var(--text-strong); }
    .brand-face { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: #263143; color: #f5d76b; }
    .side-label { margin: 24px 8px 8px; font-size: 12px; color: var(--text-muted); }
    .side-item { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; color: var(--text-muted); font-size: 14px; }
    .side-item.active { background: #202125; color: var(--text-strong); font-weight: 550; }
    .side-icon { width: 18px; text-align: center; color: #9b9da5; }

    .pane { min-width: 0; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--surface-pane); overflow: hidden; }
    .header { min-height: 64px; padding: 14px 20px 12px; border-bottom: 1px solid var(--border-subtle); }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    h1 { margin: 0; color: var(--text-strong); font-size: 16px; line-height: 24px; font-weight: 650; }
    .subtitle { margin-top: 4px; color: var(--text-muted); font-size: 12px; }
    .density-note { color: var(--text-faint); font-size: 11px; font-variant-numeric: tabular-nums; }

    .lab { padding: 12px 20px; border-bottom: 1px solid var(--border-subtle); background: rgba(255,255,255,.012); }
    .lab-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .control-label { margin-right: 2px; color: var(--text-muted); font-size: 12px; }
    .segmented { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--border-default); border-radius: 8px; background: #101114; }
    .segmented button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 12px; }
    .segmented button:hover { color: var(--text-body); background: var(--surface-hover); }
    .segmented button[aria-pressed="true"] { background: #292a30; color: var(--text-strong); box-shadow: inset 0 0 0 1px rgba(255,255,255,.045); }
    .recommend { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; color: #b5b9ff; font-size: 12px; }
    .recommend::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(123,131,237,.12); }
    .explain { min-height: 34px; display: flex; align-items: center; gap: 16px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-subtle); }
    .explain strong { color: var(--text-strong); font-size: 13px; }
    .explain p { margin: 0; color: var(--text-muted); font-size: 12px; line-height: 18px; }
    .score { margin-left: auto; display: flex; gap: 16px; color: var(--text-faint); font-size: 11px; white-space: nowrap; }
    .score b { margin-left: 4px; color: var(--text-body); font-weight: 550; }

    .table-wrap { overflow-x: auto; }
    .grid { min-width: 960px; }
    .table-head, .trade-row { display: grid; grid-template-columns: minmax(260px,1.1fr) minmax(300px,1.5fr) 84px 96px 92px; align-items: center; column-gap: 16px; padding: 0 20px; }
    .table-head { height: 40px; border-bottom: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 12px; font-weight: 550; }
    .trade-row { height: var(--row-h); border-bottom: 1px solid rgba(255,255,255,.035); font-size: 13px; }
    .trade-row:hover { background: rgba(255,255,255,.022); }
    .trade-cell { min-width: 0; display: flex; align-items: center; }
    .trade { gap: 8px; }
    .status { width: 16px; height: 16px; display: grid; place-items: center; flex: 0 0 16px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 9px; font-weight: 700; }
    .status.win { color: color-mix(in srgb, var(--pos) 70%, var(--text-muted)); }
    .status.loss { color: color-mix(in srgb, var(--neg) 72%, var(--text-muted)); }
    .status.missed { color: #8e8076; background: #8e8076; }
    .symbol { min-width: 84px; display: inline-flex; align-items: center; gap: 7px; color: var(--text-strong); font-weight: 550; }
    .direction { margin-left: 2px; color: #87919d; font-size: 12px; }

    .mark { width: var(--mark-size); height: var(--mark-size); display: inline-grid; place-items: center; flex: 0 0 var(--mark-size); color: var(--mark-color); line-height: 1; }
    .mark svg { width: 70%; height: 70%; display: block; }
    .mark .glyph { font-weight: 700; font-size: max(9px, calc(var(--mark-size) * .52)); letter-spacing: -.04em; }
    .mark[data-key="xau"] { --mark-color: var(--gold); }
    .mark[data-key="eur"] { --mark-color: var(--eur); }
    .mark[data-key="gbp"] { --mark-color: var(--gbp); }
    .mark[data-key="btc"] { --mark-color: var(--btc); }
    .mark[data-key="eth"] { --mark-color: var(--eth); }
    .mark[data-key="sol"] { --mark-color: var(--sol); }

    /* 当前：低面积、低强度，是本轮要解决的可读性基线。 */
    body[data-mode="current"] .mark { border-radius: 50%; color: color-mix(in srgb, var(--mark-color) 64%, var(--text-muted)); background: color-mix(in srgb, var(--mark-color) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mark-color) 8%, transparent); }
    body[data-mode="current"] .mark svg { width: 58%; height: 58%; }
    body[data-mode="current"] .mark .glyph { font-size: max(8px, calc(var(--mark-size) * .46)); }

    /* A：保持官方符号语义，提升前景和底色的分离度。 */
    body[data-mode="badge"] .mark { border-radius: 50%; color: color-mix(in srgb, var(--mark-color) 92%, white 8%); background: color-mix(in srgb, var(--mark-color) 18%, #101114); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mark-color) 22%, transparent); }
    body[data-mode="badge"] .mark svg { width: 76%; height: 76%; }
    body[data-mode="badge"] .mark .glyph { font-size: max(10px, calc(var(--mark-size) * .58)); }

    /* B：去除容器，让官方符号以较大净轮廓出现。 */
    body[data-mode="bare"] .mark { color: color-mix(in srgb, var(--mark-color) 86%, var(--text-body)); }
    body[data-mode="bare"] .mark svg { width: 82%; height: 82%; }
    body[data-mode="bare"] .mark .glyph { font-size: max(11px, calc(var(--mark-size) * .66)); }

    /* C：不假装是图标，以稳定代码牌换取极高识别度。 */
    body[data-mode="code"] .mark { width: calc(var(--mark-size) + 9px); flex-basis: calc(var(--mark-size) + 9px); border-radius: 5px; background: color-mix(in srgb, var(--mark-color) 13%, #111216); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mark-color) 18%, transparent); color: color-mix(in srgb, var(--mark-color) 76%, white 24%); }
    body[data-mode="code"] .mark svg, body[data-mode="code"] .mark .glyph { display: none; }
    body[data-mode="code"] .mark::after { content: attr(data-code); font-size: max(8px, calc(var(--mark-size) * .47)); font-weight: 700; letter-spacing: .02em; }

    .strategy { gap: 10px; color: var(--text-muted); overflow: hidden; }
    .strategy-pill { flex: 0 0 auto; height: 24px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border-subtle); color: #a6a8ae; font-size: 12px; }
    .tag { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .more { flex: 0 0 auto; color: var(--text-faint); font-size: 12px; }
    .period, .date { color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .result { justify-content: flex-end; font-weight: 650; font-variant-numeric: tabular-nums; }
    .result.pos { color: var(--pos); }
    .result.neg { color: var(--neg); }
    .date { justify-content: flex-end; }

    .footnote { min-height: 54px; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; color: var(--text-faint); font-size: 11px; }
    .legend { display: flex; gap: 16px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .legacy { color: var(--text-muted); }

    @media (max-width: 1180px) {
      :root { --sidebar: 184px; }
      .score { display: none; }
      .recommend { margin-left: 0; }
      .table-head, .trade-row { grid-template-columns: minmax(240px,1.05fr) minmax(260px,1.3fr) 72px 84px 82px; padding-left: 16px; padding-right: 16px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .mark { transition: width 120ms ease, height 120ms ease, background 120ms ease, color 120ms ease, border-radius 120ms ease; }
    }
  </style>
</head>
<body data-mode="badge">
  <main class="app">
    <aside class="sidebar" aria-label="工作区导航">
      <div class="brand"><span class="brand-face">☺</span><span>TQQQ</span></div>
      <div class="side-label">工作区</div>
      <div class="side-item active"><span class="side-icon">☷</span>交易日志</div>
      <div class="side-item"><span class="side-icon">▤</span>案例库</div>
      <div class="side-item"><span class="side-icon">↻</span>随机复盘</div>
      <div class="side-item"><span class="side-icon">⌁</span>统计分析</div>
      <div class="side-item"><span class="side-icon">▦</span>周期复盘</div>
      <div class="side-label">更多</div>
      <div class="side-item"><span class="side-icon">⌑</span>随记</div>
      <div class="side-item"><span class="side-icon">↗</span>导航1</div>
      <div class="side-item"><span class="side-icon">⇆</span>导航2</div>
    </aside>

    <section class="pane" aria-labelledby="page-title">
      <header class="header">
        <div class="header-top">
          <div>
            <h1 id="page-title">交易列表 · 小尺寸品种标识验证</h1>
            <div class="subtitle">相同行高、文字和业务色，只替换品种标识方案</div>
          </div>
          <div class="density-note">桌面列表 · 52px 行高 · 13px 主项</div>
        </div>
      </header>

      <section class="lab" aria-label="方案控制">
        <div class="lab-row">
          <span class="control-label">方案</span>
          <div class="segmented" id="mode-controls" aria-label="图标方案">
            <button type="button" data-mode="current" aria-pressed="false">当前基线</button>
            <button type="button" data-mode="badge" aria-pressed="true">A 高对比圆章</button>
            <button type="button" data-mode="bare" aria-pressed="false">B 无底符号</button>
            <button type="button" data-mode="code" aria-pressed="false">C 紧凑代码牌</button>
          </div>
          <span class="control-label">尺寸</span>
          <div class="segmented" id="size-controls" aria-label="图标尺寸">
            <button type="button" data-size="16" aria-pressed="false">16</button>
            <button type="button" data-size="18" aria-pressed="true">18</button>
            <button type="button" data-size="20" aria-pressed="false">20</button>
            <button type="button" data-size="22" aria-pressed="false">22</button>
          </div>
          <span class="recommend">建议先看 A / 18px 与 A / 20px</span>
        </div>
        <div class="explain">
          <strong id="mode-title">A · 高对比圆章</strong>
          <p id="mode-copy" data-pretext>保留统一圆形容器，但让符号占比与前景对比真正适配列表小尺寸。</p>
          <div class="score"><span>识别度<b id="clarity">高</b></span><span>视觉噪声<b id="noise">中低</b></span><span>横向占用<b id="width">低</b></span></div>
        </div>
      </section>

      <div class="table-wrap">
        <div class="grid" role="table" aria-label="交易日志图标方案预览">
          <div class="table-head" role="row">
            <div role="columnheader">交易</div><div role="columnheader">策略 / 标签</div><div role="columnheader">周期</div><div role="columnheader" style="text-align:right">结果</div><div role="columnheader" style="text-align:right">日期</div>
          </div>
          <div id="rows"></div>
        </div>
      </div>

      <footer class="footnote">
        <div class="legend"><span style="color:var(--gold)"><i></i>金属</span><span style="color:var(--eur)"><i></i>外汇</span><span style="color:var(--btc)"><i></i>加密资产</span></div>
        <span class="legacy">SOLUSDT 仅作为历史数据兼容样本，不属于当前可选品种。</span>
      </footer>
    </section>
  </main>

  <!-- FALLBACK: vendor/pretext.js missing, using CDN -->
  <script type="module">
    import { prepare, layout } from 'https://esm.sh/@chenglou/pretext';
    document.querySelectorAll('[data-pretext]').forEach((element) => {
      try { layout(element, prepare(element.textContent || '')); } catch (_) { /* 文案仍可正常显示 */ }
    });
  </script>
  <script>
    const samples = [
      ['win','XAUUSD','xau','AU','多','导航1','伦敦盘','+4.18R','4H','7月13日'],
      ['win','EURUSD','eur','EUR','空','导航3','伦敦收盘','+3.64R','15M','7月14日'],
      ['win','GBPUSD','gbp','GBP','多','导航4','纽约盘','+4.38R','15M','7月15日'],
      ['loss','BTCUSDT','btc','BTC','多','导航4','纽约盘','-0.69R','15M','7月15日'],
      ['missed','ETHUSDT','eth','ETH','空','导航3','伦敦开盘','+10.4R','1H','7月16日'],
      ['missed','XAUUSD','xau','AU','空','导航1','纽约盘','+5.37R','1H','7月17日'],
      ['loss','EURUSD','eur','EUR','多','导航1','伦敦盘','-1.10R','4H','7月17日'],
      ['loss','GBPUSD','gbp','GBP','多','导航1','纽约盘','-1.18R','4H','7月17日'],
      ['loss','BTCUSDT','btc','BTC','多','导航2','纽约盘','-1.70R','1H','7月20日'],
      ['loss','ETHUSDT','eth','ETH','多','导航2','纽约盘','-1.50R','1H','7月20日'],
      ['loss','SOLUSDT','sol','SOL','多','导航2','纽约盘','-1.29R','4H','7月20日'],
      ['win','BTCUSDT','btc','BTC','多','导航2','纽约盘','+4.03R','4H','7月20日'],
      ['loss','ETHUSDT','eth','ETH','多','导航4','纽约盘','-1.50R','15M','7月21日'],
      ['missed','EURUSD','eur','EUR','空','导航3','伦敦盘','+6.00R','4H','7月21日']
    ];

    function ethSvg() {
      return '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.1 3.55 8 8 10.55 12.45 8 8 1.1Z" fill="currentColor"/><path d="M8 11.35 3.55 8.9 8 14.9l4.45-6L8 11.35Z" fill="currentColor" opacity=".72"/></svg>';
    }
    function btcSvg() {
      return '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M9.2 2.1v1.2c1.8.24 2.75 1.1 2.75 2.45 0 .96-.54 1.7-1.56 2.1 1.3.37 1.96 1.2 1.96 2.47 0 1.66-1.16 2.68-3.15 2.91v1.2H8.05v-1.13H7.1v1.13H5.95v-1.13H3.9v-1.4h1.1V4.64H3.9v-1.4h2.05V2.1H7.1v1.14h.95V2.1H9.2ZM7.05 7.28h1.4c.94 0 1.42-.39 1.42-1.15 0-.72-.5-1.08-1.5-1.08H7.05v2.23Zm0 4.18h1.64c1.04 0 1.56-.43 1.56-1.29 0-.82-.55-1.23-1.66-1.23H7.05v2.52Z"/></svg>';
    }
    function mark(key, code) {
      let inside = `<span class="glyph">${key === 'xau' ? 'Au' : key === 'eur' ? '€' : key === 'gbp' ? '£' : key === 'sol' ? '◎' : ''}</span>`;
      if (key === 'eth') inside = ethSvg();
      if (key === 'btc') inside = btcSvg();
      return `<span class="mark" data-key="${key}" data-code="${code}" aria-hidden="true">${inside}</span>`;
    }
    function row(item) {
      const [status,symbol,key,code,direction,strategy,tag,result,period,date] = item;
      const sign = result.startsWith('+') ? 'pos' : 'neg';
      const statusGlyph = status === 'win' ? '✓' : status === 'loss' ? '×' : '';
      return `<div class="trade-row" role="row">
        <div class="trade-cell trade" role="cell"><span class="status ${status}">${statusGlyph}</span><span class="symbol">${mark(key,code)}<span>${symbol}</span></span><span class="direction">${direction}</span></div>
        <div class="trade-cell strategy" role="cell"><span class="strategy-pill">${strategy}</span><span class="tag">${tag}</span><span class="more">+3</span></div>
        <div class="trade-cell period" role="cell">${period}</div>
        <div class="trade-cell result ${sign}" role="cell">${result}</div>
        <div class="trade-cell date" role="cell">${date}</div>
      </div>`;
    }
    document.getElementById('rows').innerHTML = samples.map(row).join('');

    const descriptions = {
      current: ['当前基线','低强度底色与较小内部符号，在 16–18px 时容易被交易状态和文字吞没。','偏低','低','低'],
      badge: ['A · 高对比圆章','保留统一圆形容器，但让符号占比与前景对比真正适配列表小尺寸。','高','中低','低'],
      bare: ['B · 无底官方符号','取消容器，把有限像素全部交给官方符号；更清楚，但五种资产的视觉重量略不一致。','高','最低','低'],
      code: ['C · 紧凑代码牌','用稳定宽度的短代码代替象形符号；识别最直接，但会增加列表横向占用。','最高','中','较高']
    };
    document.getElementById('mode-controls').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-mode]');
      if (!button) return;
      document.body.dataset.mode = button.dataset.mode;
      document.querySelectorAll('#mode-controls button').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      const [title,copy,clarity,noise,width] = descriptions[button.dataset.mode];
      document.getElementById('mode-title').textContent = title;
      document.getElementById('mode-copy').textContent = copy;
      document.getElementById('clarity').textContent = clarity;
      document.getElementById('noise').textContent = noise;
      document.getElementById('width').textContent = width;
    });
    document.getElementById('size-controls').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-size]');
      if (!button) return;
      document.documentElement.style.setProperty('--mark-size', `${button.dataset.size}px`);
      document.querySelectorAll('#size-controls button').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
    });
  </script>
</body>
</html>
